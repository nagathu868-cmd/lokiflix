<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOKIFLIX</title>
<style>body{margin:0;background:#030407;color:#fff;font-family:Arial}.top{padding:20px 5%;border-bottom:1px solid #171a21}.logo{font-size:25px;font-weight:800}.logo span{color:#e50914}.wrap{width:min(1100px,92%);margin:30px auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}.card{background:#0b0d12;border:1px solid #191d25;border-radius:10px;overflow:hidden;cursor:pointer}.poster{height:260px;background:#12151c;display:grid;place-items:center;color:#777}.poster img{width:100%;height:100%;object-fit:cover}.info{padding:12px}.meta{color:#858b96;font-size:12px}video{width:100%;max-height:70vh;background:#000}.player{margin-bottom:25px}</style></head><body><header class="top"><div class="logo">LOKI<span>FLIX</span></div></header><main class="wrap"><div id="player" class="player"></div><div id="grid" class="grid"></div></main>
<script>
async function load(){const ms=await fetch("/api/movies").then(r=>r.json());const g=document.getElementById("grid");g.innerHTML=ms.map(m=>`<article class="card" onclick="play('${m.video}','${encodeURIComponent(m.title)}')"><div class="poster">${m.poster?`<img src="${m.poster}">`:"POSTER"}</div><div class="info"><b>${m.title}</b><div class="meta">${m.year} · ${m.genre} · ${m.duration}</div></div></article>`).join("")||"<p>No movies yet.</p>"}function play(v,t){document.getElementById("player").innerHTML=`<h2>${decodeURIComponent(t)}</h2><video controls autoplay src="${v}"></video>`;scrollTo({top:0,behavior:"smooth"})}load();
</script></body></html>
