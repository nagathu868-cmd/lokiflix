<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOKIFLIX Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#030407;color:#f5f6f8;font-family:Arial}.top{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #181c24}.logo{font-size:24px;font-weight:800}.logo span{color:#e50914}.wrap{width:min(900px,92%);margin:35px auto}.panel{background:#0a0d12;border:1px solid #1c2029;border-radius:14px;padding:22px;margin-bottom:25px}input,textarea,select{width:100%;padding:12px;margin:6px 0 12px;border-radius:7px;border:1px solid #282d37;background:#11141a;color:#fff}textarea{min-height:90px}button{padding:11px 16px;border:0;border-radius:7px;background:#e50914;color:#fff;font-weight:700;cursor:pointer}.logout{background:#252a33}.movie{display:flex;gap:15px;padding:14px 0;border-bottom:1px solid #20242c;align-items:center}.movie img{width:55px;height:75px;object-fit:cover;background:#151820}.movie small{color:#8d929d}.delete{margin-left:auto;background:#282d35}.progress{height:8px;background:#1b1f27;border-radius:9px;overflow:hidden;margin:10px 0}.bar{height:100%;width:0;background:#e50914}.msg{color:#aeb4bf}</style></head><body><header class="top"><div class="logo">LOKI<span>FLIX</span> <small>ADMIN</small></div><form method="post" action="/logout"><button class="logout">Logout</button></form></header><main class="wrap">
<section class="panel"><h2>Upload movie</h2><form id="uploadForm" enctype="multipart/form-data">
<label>Movie title</label><input name="title" required>
<label>Year</label><input name="year" type="number" placeholder="2026">
<label>Genre</label><select name="genre"><option>Action</option><option>Drama</option><option>Comedy</option><option>Sci-Fi</option><option>Other</option></select>
<label>Duration</label><input name="duration" placeholder="2h 10m">
<label>Description</label><textarea name="description" placeholder="Movie description"></textarea>
<label>Video file</label><input name="video" type="file" accept="video/*" required>
<label>Poster image (optional)</label><input name="poster" type="file" accept="image/*">
<div class="progress"><div class="bar" id="bar"></div></div><p class="msg" id="msg"></p><button>Upload to LOKIFLIX</button>
</form></section>
<section class="panel"><h2>Movies</h2><div id="list">Loading...</div></section></main>
<script>
const form=document.getElementById("uploadForm"),bar=document.getElementById("bar"),msg=document.getElementById("msg");
form.onsubmit=e=>{e.preventDefault();const x=new XMLHttpRequest();x.open("POST","/api/movies");x.upload.onprogress=e=>{if(e.lengthComputable)bar.style.width=(e.loaded/e.total*100)+"%"};x.onload=()=>{if(x.status===200){msg.textContent="Upload complete!";form.reset();bar.style.width="0";load()}else msg.textContent="Upload failed: "+x.responseText};x.onerror=()=>msg.textContent="Network error";x.send(new FormData(form))};
async function load(){const ms=await fetch("/api/movies").then(r=>r.json());document.getElementById("list").innerHTML=ms.length?ms.map(m=>`<div class="movie">${m.poster?`<img src="${m.poster}">`:`<div style="width:55px;height:75px;background:#151820"></div>`}<div><b>${esc(m.title)}</b><br><small>${esc(m.year)} · ${esc(m.genre)} · ${esc(m.duration)}</small></div><button class="delete" onclick="del('${m.id}')">Delete</button></div>`).join(""):"<p class='msg'>No movies uploaded yet.</p>"}
async function del(id){if(!confirm("Delete this movie?"))return;await fetch("/api/movies/"+id,{method:"DELETE"});load()}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}load();
</script></body></html>
